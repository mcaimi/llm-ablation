[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ablation"
version = "0.1.0"
description = "An example LLM ablation at three levels: attention heads/neurons/layers, steering-vector directions, and application pipelines."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "mcaimi@redhat.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.33",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "torchinfo>=1.8.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipywidgets>=8.1"]
interp-extras = ["nnsight>=0.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.urls]
Repository = "https://github.com/mcaimi/llm-ablation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that download a (tiny) model from the Hugging Face Hub"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
